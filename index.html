<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a1648" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Uma carta de aniversário para abrir com carinho."
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Feliz aniversário</title>
    <link rel="icon" href="favicon.svg?v=20251113-v2" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20251113-v2" />
  </head>
  <body>
    <a id="pular" class="skip" href="#envelope"></a>

    <div class="sparkles" aria-hidden="true"></div>
    <canvas id="confetti" class="confetti" hidden></canvas>
    <canvas id="pinguins" class="pinguins" hidden></canvas>

    <section id="capa" class="capa" aria-label="Capa com envelope">
      <div class="brilho" aria-hidden="true"></div>
      <div class="balao balao--a" aria-hidden="true"></div>
      <div class="balao balao--b" aria-hidden="true"></div>
      <div class="balao balao--c" aria-hidden="true"></div>
      <div class="balao balao--d" aria-hidden="true"></div>
      <div class="pinguim pinguim--a" aria-hidden="true"></div>
      <div class="pinguim pinguim--b" aria-hidden="true"></div>
      <div class="pinguim pinguim--c" aria-hidden="true"></div>

      <header class="capa__texto">
        <p id="kicker" class="capa__kicker"></p>
        <h1 class="capa__titulo">
          Para <span id="capa-nome"></span>,
        </h1>
        <p class="capa__de">de <span id="capa-de"></span></p>
      </header>

      <button
        type="button"
        id="envelope"
        class="envelope"
        aria-describedby="dica"
      >
        <span class="envelope__cena">
          <span class="envelope__sombra" aria-hidden="true"></span>
          <span
            class="envelope__costas envelope__papel-env"
            aria-hidden="true"
          ></span>
          <span
            class="envelope__dobra envelope__dobra--esq envelope__papel-env envelope__papel-env--forro"
            aria-hidden="true"
          ></span>
          <span
            class="envelope__dobra envelope__dobra--dir envelope__papel-env envelope__papel-env--forro"
            aria-hidden="true"
          ></span>
          <span class="envelope__cartinha" aria-hidden="true"></span>
          <span class="envelope__frente envelope__papel-env" aria-hidden="true">
            <span class="envelope__endereco">
              <span class="envelope__para">Para</span>
              <span id="envelope-nome" class="envelope__nome"></span>
              <span class="envelope__de"
                >de <span id="envelope-de"></span></span
              >
            </span>
          </span>
          <span class="envelope__aba envelope__papel-env" aria-hidden="true"></span>
          <span class="envelope__lacre" aria-hidden="true">
            <span class="envelope__lacre-cera"></span>
            <img
              class="envelope__lacre-pinguim"
              src="penguin.svg?v=20251113-v2"
              width="44"
              height="44"
              alt=""
            />
          </span>
        </span>
      </button>

      <p id="dica" class="dica"></p>
    </section>

    <article id="carta" class="carta" hidden>
      <p id="aviso" class="aviso" hidden></p>

      <p id="carta-data" class="carta__data"></p>
      <h2 id="carta-saudacao" class="carta__saudacao" tabindex="-1"></h2>
      <p id="carta-feliz" class="carta__feliz"></p>
      <div id="carta-texto" class="carta__texto"></div>

      <footer class="carta__assinatura">
        <p id="despedida"></p>
        <p id="assinatura" class="carta__nome"></p>
      </footer>
      <span id="fim-carta" class="fim-carta" aria-hidden="true"></span>

      <button type="button" id="guardar" class="guardar"></button>
    </article>

    <script src="content.js?v=20251113-v2"></script>
    <script src="app.js?v=20251113-v2"></script>
  </body>
</html>
